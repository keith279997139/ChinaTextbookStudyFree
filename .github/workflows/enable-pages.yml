name: Enable GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (source: main / root, build type legacy)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api="https://api.github.com/repos/${REPO}/pages"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'

          code=$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          echo "GET $api -> $code"
          cat /tmp/get.json || true

          if [ "$code" = "404" ]; then
            code2=$(curl -sS -o /tmp/write.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload" "$api")
            echo "POST -> $code2"
            cat /tmp/write.json || true
            if [ "$code2" = "201" ] || [ "$code2" = "409" ]; then exit 0; fi
            exit 1
          fi

          if [ "$code" = "200" ]; then
            code2=$(curl -sS -o /tmp/write.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload" "$api")
            echo "PUT -> $code2"
            cat /tmp/write.json || true
            if [ "$code2" = "204" ]; then exit 0; fi
            exit 1
          fi

          echo "Unexpected status $code"; exit 1
