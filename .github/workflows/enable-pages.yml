name: Enable GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  contents: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pages API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api="https://api.github.com/repos/${REPO}/pages"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          : > /tmp/out.txt

          code=$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" || echo "curl-error")
          echo "GET -> $code" >> /tmp/out.txt
          head -c 800 /tmp/get.json >> /tmp/out.txt 2>/dev/null || true
          echo >> /tmp/out.txt

          if [ "$code" = "404" ]; then
            code2=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload" "$api" || echo "curl-error")
            echo "POST -> $code2" >> /tmp/out.txt
            head -c 800 /tmp/post.json >> /tmp/out.txt 2>/dev/null || true
          fi

          echo "done" >> /tmp/out.txt
          cat /tmp/out.txt
        continue-on-error: true

      - name: Publish probe result to repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          file="pages-status.txt"
          content=$(base64 -w0 /tmp/out.txt)
          sha=$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/contents/${file}" | jq -r '.sha // empty')

          if [ -n "$sha" ]; then
            body=$(jq -n --arg msg "chore: 更新 Pages 探测结果" --arg c "$content" --arg s "$sha" '{message:$msg, content:$c, sha:$s}')
          else
            body=$(jq -n --arg msg "chore: 记录 Pages 探测结果" --arg c "$content" '{message:$msg, content:$c}')
          fi

          curl -sS -o /tmp/put.json -w 'PUT -> %{http_code}\n' -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$body" \
            "https://api.github.com/repos/${REPO}/contents/${file}"
          head -c 600 /tmp/put.json || true
